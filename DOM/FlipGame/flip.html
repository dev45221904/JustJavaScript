<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIPGAME</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white shadow-2xl rounded-lg p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8">FLIP GAME</h1>
        
        <div class="space-y-6">
            <div>
                <label for="flip" class="block text-lg font-semibold text-gray-700 mb-2">
                    ENTER STRING TO FLIP
                </label>
                <input 
                    type="text" 
                    id="flip" 
                    name="flip"
                    placeholder="Type something..."
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 text-gray-800"
                >
            </div>

            <button 
                id="btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 text-lg"
            >
                FLIP
            </button>
            <button 
                id="reset"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 text-lg"
            >
                RESET
            </button>

            <div class="bg-indigo-50 border-2 border-indigo-200 rounded-lg p-4">
                <p class="text-gray-600 text-sm font-semibold mb-2">Result:</p>
                <input type="text" id="new" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 text-gray-800"
                >
            </div>
        </div>
    </div>

    <script src="flip.js">
    </script>
</body>
</html>
