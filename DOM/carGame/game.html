<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>Car Game</h1>
    </div>
    <div class="carSimulation">
        <h1 id="heading">The CAR GAME(JUST THE LOGIC)</h1>
        <p id="parkedCar">CAR IS PARKED</p>
        <button id="sit">Sit in the car</button>
        <button id="lock" style="visibility: hidden;">Lock the doors</button>
        <button id="start" style="visibility: hidden;">Start the car</button>
        <button id="seatbelt" style="visibility: hidden;">Fasten your seat belts</button>
        <button id="drive" style="visibility: hidden;">Car started, You can drive</button>
    </div>
   <script src="app.js"></script> 
</body>
</html>
